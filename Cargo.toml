[package]
name = "pastebin-ai"
version = "0.1.3"
edition = "2021"
description = "A pretty CLI for pastebin.ai ✨"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mnk-works/pastebin-ai"
readme = "README.md"
keywords = ["pastebin", "cli", "snippets", "pastebin-ai"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
clap = { version = "4.3", features = ["derive", "env"] }
ureq = { version = "2.6", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2"
indicatif = "0.16"
anyhow = "1.0"
dirs = "4.0"
toml = "0.7"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[dev-dependencies]
tempfile = "3.8"